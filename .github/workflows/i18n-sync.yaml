name: i18n sync

# Fails when a locale file or a translated README falls behind its source, so a change to
# README.md (or src/i18n/locales/en.json) cannot land without the translations following.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check locale keys and translated docs
        run: node scripts/i18n-check.mjs
